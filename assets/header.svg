<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Legal Code">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010302"/>
      <stop offset="45%" stop-color="#03150c"/>
      <stop offset="100%" stop-color="#010805"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="8%" cy="10%" r="42%">
      <stop offset="0%" stop-color="#00ff85" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#00ff85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="92%" cy="90%" r="46%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="52%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#00ff64" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ff64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8ff7a"/>
      <stop offset="45%" stop-color="#00ff85"/>
      <stop offset="100%" stop-color="#00c968"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8fff0"/>
      <stop offset="100%" stop-color="#9affc9"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00ff85" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <pattern id="gridFine" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#00ff85" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <mask id="vignette">
      <rect width="1200" height="420" fill="url(#vgrad)"/>
    </mask>
    <radialGradient id="vgrad" cx="50%" cy="45%" r="68%">
      <stop offset="35%" stop-color="white"/>
      <stop offset="100%" stop-color="#666"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowTL)"/>
  <rect width="1200" height="420" fill="url(#glowBR)"/>
  <rect width="1200" height="420" fill="url(#glowC)"/>
  <rect width="1200" height="420" fill="url(#grid)" mask="url(#vignette)"/>
  <rect width="1200" height="420" fill="url(#gridFine)" opacity="0.7" mask="url(#vignette)"/>

  <!-- frame -->
  <rect x="28" y="28" width="1144" height="364" rx="28" fill="none" stroke="#00ff85" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="40" y="40" width="1120" height="340" rx="22" fill="none" stroke="#00ff85" stroke-opacity="0.08" stroke-width="1"/>

  <!-- LC mark -->
  <g filter="url(#softGlow)" transform="translate(92 118)">
    <rect width="148" height="148" rx="40" fill="url(#neon)"/>
    <text x="74" y="98" text-anchor="middle"
          font-family="Syne, Arial Black, Helvetica, sans-serif"
          font-size="64" font-weight="800" letter-spacing="0.04em" fill="#04110a">LC</text>
  </g>

  <!-- brand -->
  <g transform="translate(286 148)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="0.28em" fill="#39ff14" opacity="0.9"
          filter="url(#textGlow)">SENIOR FULLSTACK DEVELOPER</text>

    <text y="78" font-family="Syne, Arial Black, Helvetica, sans-serif"
          font-size="72" font-weight="800" letter-spacing="-0.03em"
          fill="url(#titleGrad)" filter="url(#textGlow)">Legal Code</text>

    <text y="128" font-family="Syne, Arial Black, Helvetica, sans-serif"
          font-size="28" font-weight="700" fill="#39ff14" filter="url(#textGlow)">&lt;/&gt;</text>
    <text x="64" y="128" font-family="Outfit, Inter, Helvetica, sans-serif"
          font-size="24" fill="#b7cfc0">Вы даёте идею — я создаю решение</text>
  </g>

  <!-- bottom chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9affc9">
    <g transform="translate(286 332)">
      <rect width="118" height="34" rx="10" fill="#00ff85" fill-opacity="0.08" stroke="#00ff85" stroke-opacity="0.35"/>
      <text x="59" y="22" text-anchor="middle">Web</text>
    </g>
    <g transform="translate(416 332)">
      <rect width="118" height="34" rx="10" fill="#00ff85" fill-opacity="0.08" stroke="#00ff85" stroke-opacity="0.35"/>
      <text x="59" y="22" text-anchor="middle">Bots</text>
    </g>
    <g transform="translate(546 332)">
      <rect width="118" height="34" rx="10" fill="#00ff85" fill-opacity="0.08" stroke="#00ff85" stroke-opacity="0.35"/>
      <text x="59" y="22" text-anchor="middle">Web3</text>
    </g>
    <g transform="translate(676 332)">
      <rect width="148" height="34" rx="10" fill="#00ff85" fill-opacity="0.08" stroke="#00ff85" stroke-opacity="0.35"/>
      <text x="74" y="22" text-anchor="middle">Automation</text>
    </g>
  </g>
</svg>
